services:
  api:
    build: .
    container_name: awebo-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      # UPLOADS_DIR=uploads (относительный, см. .env.example) резолвится от
      # WORKDIR контейнера — /app/uploads. Без этого тома аватарки/картинки
      # статей/постов живут в эфемерном слое контейнера и пропадают при
      # каждом пересоздании (docker-compose up --build и т.п.).
      - uploads_data:/app/uploads
    networks:
      - awebo-network

networks:
  awebo-network:
    external: true
    name: awebo-network

volumes:
  postgres_data:
  uploads_data:

